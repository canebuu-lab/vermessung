name: Build Windows EXE

on:
  push:
    branches:
      - claude/ocr-gps-street-sorting-g8qpje
    paths:
      - 'tools/gps_ocr_sort/**'
      - '.github/workflows/build-exe.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r tools/gps_ocr_sort/requirements.txt pyinstaller

      - name: Build exe
        working-directory: tools/gps_ocr_sort
        run: |
          pyinstaller --onefile --windowed --name SokakGPSAyirici gui.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SokakGPSAyirici-windows
          path: tools/gps_ocr_sort/dist/SokakGPSAyirici.exe

      - name: Commit exe into repo
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p tools/gps_ocr_sort/dist_release
          cp tools/gps_ocr_sort/dist/SokakGPSAyirici.exe tools/gps_ocr_sort/dist_release/SokakGPSAyirici.exe
          git add tools/gps_ocr_sort/dist_release/SokakGPSAyirici.exe
          git diff --cached --quiet && echo "no changes" || git commit -m "Add built Windows exe [skip ci]"
          git push
